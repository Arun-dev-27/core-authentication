# Development: builds and runs core-authentication ONLY.
#
# No PostgreSQL service, no database volume, no migration, no seed, no init script. The app connects to the
# EXISTING identity database and schema given in ../.env (IDENTITY_DB_HOST/PORT/NAME/SCHEMA/USER/PASSWORD - all
# required, no defaults) and reads the existing records there. It refuses to start if that schema or any mapped
# table/column does not already exist.
#
#   cp .env.example .env   # fill in the existing database values
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Inside the container "localhost" is the container itself: use the real database / Redis host names
# (or host.docker.internal for services running on this machine).
name: miqaat-authn

services:
  authn:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: miqaat-identity-federation-service:dev
    container_name: miqaat-authn
    env_file:
      - ../.env
    environment:
      # Only these three can differ between a host run and a container run, and only while the
      # database / Redis / authorization service are containers on this machine: there "localhost"
      # in ../.env means the container itself. Setting DOCKER_* in that same file overrides them.
      # Point at real endpoints (RDS, ElastiCache, a deployed authz service) and DOCKER_* is not
      # needed at all - drop those lines and the normal values are used, host and container alike.
      IDENTITY_DB_HOST: ${DOCKER_IDENTITY_DB_HOST:-${IDENTITY_DB_HOST}}
      REDIS_URL: ${DOCKER_REDIS_URL:-${REDIS_URL}}
      AUTHZ_BASE_URL: ${DOCKER_AUTHZ_BASE_URL:-${AUTHZ_BASE_URL}}
    ports:
      - "3001:3001"
    volumes:
      # Signing keys come from AWS SSM (SIGNING_KEY_PROVIDER=ssm), not from disk. ../.keys is mounted
      # read-only only so a fallback to the file provider still finds a keyset. Nothing database-related.
      - ../.keys:/app/.keys:ro
    restart: unless-stopped

