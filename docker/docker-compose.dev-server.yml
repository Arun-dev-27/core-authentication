# core-authentication on the Miqaat Core DEV server.
#
# Runs the application only, attached to the existing `dev_miqaat_core_net` so it can reach the existing identity
# database and Redis by their host names. No database container, no migration, no table creation, no seed:
# IDENTITY_DB_* in ../.env.dev-server must name the existing database and schema, and the app refuses to start if
# that schema or any mapped table/column is missing.
#
#   docker compose -f docker/docker-compose.dev-server.yml up -d --build
name: miqaat-authn-dev

services:
  authn:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: miqaat-identity-federation-service:dev
    container_name: dev_miqaat_authn
    env_file:
      - ../.env
    ports:
      - "3001:3001"
    volumes:
      - authn-keys:/app/.keys
    networks:
      - dev_miqaat_core_net
    restart: unless-stopped

volumes:
  authn-keys:

networks:
  dev_miqaat_core_net:
    external: true
    name: dev_miqaat_core_net
